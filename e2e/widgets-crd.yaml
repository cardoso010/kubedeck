# Sample CRD with printer columns, used by the e2e tests to check custom resource support.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kubedeck.dev
spec:
  group: kubedeck.dev
  scope: Namespaced
  names:
    kind: Widget
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                color:
                  type: string
      additionalPrinterColumns:
        - name: Size
          jsonPath: .spec.size
          type: string
        - name: Color
          jsonPath: .spec.color
          type: string
          priority: 1
        - name: Age
          jsonPath: .metadata.creationTimestamp
          type: date
---
apiVersion: kubedeck.dev/v1
kind: Widget
metadata:
  name: sprocket
  namespace: demo
spec:
  size: large
  color: blue
