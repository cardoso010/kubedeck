[package]
name = "kubedeck"
version = "0.4.0"
description = "Kubernetes desktop client"
authors = ["The kubedeck authors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kubedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "runtime", "ws", "jsonpatch"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["sync", "io-util", "macros", "time", "net", "process"] }
futures = "0.3"
serde_yaml = "0.9"
anyhow = "1"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", features = ["json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
http = "1"
form_urlencoded = "1"
jiff = "0.2"
json-patch = "4"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
keyring = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin LTO over 16 codegen units compiles the app crate about 4x faster than fat LTO with a
# single unit (51s vs 213s locally) for ~3 MB more binary; the bundled Helm dominates the
# app size anyway.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
