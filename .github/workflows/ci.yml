name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The runner's default apt mirror (azure.archive.ubuntu.com) is sometimes extremely
      # slow, so prefer the main Ubuntu archive and keep Azure as a fallback. Skip
      # recommended packages and fail this step on its own instead of eating the job timeout.
      - name: Tauri system dependencies
        timeout-minutes: 20
        run: |
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run binaries
      - run: npx tsc --noEmit
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
        timeout-minutes: 15

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Disposable test cluster
        timeout-minutes: 15
        run: |
          export KUBEDECK_HELM="$PWD/src-tauri/binaries/helm-x86_64-unknown-linux-gnu"
          e2e/setup.sh

      - name: End-to-end tests
        working-directory: src-tauri
        timeout-minutes: 15
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/.kind-kubeconfig"
          export KUBEDECK_HELM="$PWD/binaries/helm-x86_64-unknown-linux-gnu"
          export KUBEDECK_E2E_CONTEXT=kind-kubedeck-test
          cargo test -- --include-ignored
