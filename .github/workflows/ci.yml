name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# Pull requests from forks run untrusted code: give the job a read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI: faster linking and a much smaller target/ to cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Cache the downloaded .debs: the runner's default apt mirror (azure.archive.ubuntu.com)
      # is sometimes extremely slow, so also prefer the main Ubuntu archive and keep Azure as
      # a fallback, and fail this step on its own instead of eating the job timeout.
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-webkit-v1
      - name: Tauri system dependencies
        timeout-minutes: 20
        run: |
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          mkdir -p ~/apt-cache/partial
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 -o dir::cache::archives="$HOME/apt-cache" install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev
          sudo chown -R "$USER" ~/apt-cache

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Pull requests restore main's cache but do not write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci
      - run: npm run binaries

      # The kind cluster boots in the background while everything compiles.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Start the test cluster in the background
        run: |
          export KUBEDECK_HELM="$PWD/src-tauri/binaries/helm-x86_64-unknown-linux-gnu"
          nohup bash -c 'e2e/setup.sh > /tmp/e2e-setup.log 2>&1; echo $? > /tmp/e2e-setup.exit' >/dev/null 2>&1 &

      - run: npx tsc --noEmit
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Build tests
        run: cargo test --no-run
        working-directory: src-tauri
        timeout-minutes: 15

      - name: Wait for the test cluster
        timeout-minutes: 15
        run: |
          while [ ! -f /tmp/e2e-setup.exit ]; do sleep 2; done
          cat /tmp/e2e-setup.log
          exit "$(cat /tmp/e2e-setup.exit)"

      - name: Unit and end-to-end tests
        working-directory: src-tauri
        timeout-minutes: 15
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/.kind-kubeconfig"
          export KUBEDECK_HELM="$PWD/binaries/helm-x86_64-unknown-linux-gnu"
          export KUBEDECK_E2E_CONTEXT=kind-kubedeck-test
          cargo test -- --include-ignored
