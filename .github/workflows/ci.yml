name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Cached between runs: the runner's apt mirror is sometimes very slow.
      - name: Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        timeout-minutes: 20
        with:
          packages: libwebkit2gtk-4.1-dev librsvg2-dev
          version: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run binaries
      - run: npx tsc --noEmit
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
        timeout-minutes: 15

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Disposable test cluster
        timeout-minutes: 15
        run: |
          export KUBEDECK_HELM="$PWD/src-tauri/binaries/helm-x86_64-unknown-linux-gnu"
          e2e/setup.sh

      - name: End-to-end tests
        working-directory: src-tauri
        timeout-minutes: 15
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/.kind-kubeconfig"
          export KUBEDECK_HELM="$PWD/binaries/helm-x86_64-unknown-linux-gnu"
          export KUBEDECK_E2E_CONTEXT=kind-kubedeck-test
          cargo test -- --include-ignored
