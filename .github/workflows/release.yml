name: Release

# Pushing a v* tag (npm run release -- x.y.z --push) builds every platform into a draft
# release, adds latest.json and publishes it, so installed apps only see complete releases.
# Running it by hand (Actions → Release → Run workflow) only builds and keeps the bundles as
# workflow artifacts, to check packaging without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versions match the tag
        run: node scripts/release.mjs --check "$GITHUB_REF_NAME"
      - name: Create draft release
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "kubedeck $GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    # Also runs when the draft job is skipped (manual runs).
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, suffix: aarch64, bundles: "app,dmg" }
          - { os: macos-latest, target: x86_64-apple-darwin, suffix: x86_64, bundles: "app,dmg" }
          # 22.04: an older glibc keeps the AppImage working on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, suffix: linux_x86_64, bundles: "appimage,deb" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: windows_x86_64, bundles: "nsis" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # The default Azure apt mirror is sometimes extremely slow (see ci.yml).
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev patchelf libfuse2 file

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect bundles
        run: |
          version="$(node -p 'require("./package.json").version')"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          name="kubedeck_${version}_${{ matrix.suffix }}"
          mkdir out
          case "${{ runner.os }}" in
            macOS)
              cp "$bundle/macos/kubedeck.app.tar.gz" "out/$name.app.tar.gz"
              cp "$bundle/macos/kubedeck.app.tar.gz.sig" "out/$name.app.tar.gz.sig"
              cp "$bundle"/dmg/*.dmg "out/$name.dmg" ;;
            Linux)
              cp "$bundle"/appimage/*.AppImage "out/$name.AppImage"
              cp "$bundle"/appimage/*.AppImage.sig "out/$name.AppImage.sig"
              cp "$bundle"/deb/*.deb "out/$name.deb" ;;
            Windows)
              cp "$bundle"/nsis/*-setup.exe "out/$name-setup.exe"
              cp "$bundle"/nsis/*-setup.exe.sig "out/$name-setup.exe.sig" ;;
          esac
          ls -la out

      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

      - name: Keep as workflow artifacts
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kubedeck-${{ matrix.suffix }}
          path: out/*
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Updater manifest
        run: |
          node scripts/latest-json.mjs "$GITHUB_REF_NAME" > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
      - name: Publish
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
