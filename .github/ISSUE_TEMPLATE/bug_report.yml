name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to a cluster with …
        2. Open …
        3. …
  - type: input
    id: version
    attributes:
      label: kubedeck version
      description: Shown in the update popover at the bottom of the sidebar.
      placeholder: "0.4.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Linux, Windows]
    validations:
      required: true
  - type: input
    id: cluster
    attributes:
      label: Cluster
      description: Kind and version, e.g. EKS 1.33, GKE, kind, k3s. Never paste kubeconfigs, tokens or Secret values.
