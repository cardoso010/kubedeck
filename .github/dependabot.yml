# Weekly, grouped update PRs so dependency bumps arrive as a few reviewable changes.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      # kube and k8s-openapi only build at matching versions, so they always move together
      # (major bumps included). Listed first: a dependency joins the first group it matches.
      kube: { patterns: ["kube", "kube-*", "k8s-openapi"] }
      cargo: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
